# Builds the launcher for all three platforms and publishes a GitHub release.
# Tag a version to run it, e.g. `git tag v3.2.8 && git push origin v3.2.8`.
name: Release

on:
    push:
        tags:
            - "v[0-9]+.[0-9]+.[0-9]+*"
    workflow_dispatch:

permissions:
    contents: write

jobs:
    build_windows:
        uses: ./.github/workflows/build-windows.yml

    build_linux:
        uses: ./.github/workflows/build-linux.yml

    build_mac:
        uses: ./.github/workflows/build-mac.yml

    release:
        needs: [build_windows, build_linux, build_mac]
        uses: ./.github/workflows/create-release.yml
