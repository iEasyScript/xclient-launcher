name: Build macOS App

on:
    workflow_call:

concurrency:
    group: mac-build-${{ github.ref_name }}
    cancel-in-progress: true

jobs:
    build-mac:
        runs-on: macos-latest

        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Set up Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: 20
                  cache: 'npm'

            - name: Install dependencies
              run: npm ci

            - name: Run tests
              run: npm test

            - name: Build macOS app (dmg & zip)
              run: npm run mac

            - name: Get version from package.json
              id: version
              run: |
                  APP_VERSION=$(node -p "require('./package.json').version")
                  echo "version=$APP_VERSION" >> $GITHUB_OUTPUT
                  echo "App version: $APP_VERSION"

            # One universal build (Apple Silicon and Intel). The dmg is what people
            # install; latest-mac.yml lets installed launchers see a new version
            # (they send the user to the website for it while the app is unsigned).
            - name: Check build output
              run: |
                  set -euo pipefail
                  echo "Dist contents:"; ls -1 dist || true
                  ls dist/*.dmg dist/*.zip dist/latest-mac.yml > /dev/null
                  APP=$(find dist -maxdepth 2 -name "*.app" | head -n1)
                  ARCHS=$(lipo -archs "$APP/Contents/MacOS/Project X Launcher")
                  echo "$APP: $ARCHS"
                  case "$ARCHS" in *x86_64*arm64*|*arm64*x86_64*) ;; *) echo "::error::not universal: $ARCHS"; exit 1;; esac

            - name: Upload macOS artifact
              uses: actions/upload-artifact@v4
              with:
                  name: projectx-launcher-mac-latest
                  if-no-files-found: error
                  path: |
                      dist/*.dmg
                      dist/*.zip
                      dist/latest-mac.yml
