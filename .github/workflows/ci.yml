# Tests on every push and pull request. Building and releasing the app is
# deliberate and lives in release.yml, triggered by a version tag.
name: CI

on:
    push:
    pull_request:

jobs:
    test:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: 20
                  cache: npm
            - run: npm ci
            - run: npm test
