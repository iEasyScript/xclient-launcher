name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 20 is the Node inside Electron 33; 22 is the current LTS.
        node: [20, 22]
    name: Test (Node ${{ matrix.node }})
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Check the pinned VPN helper downloads still match their checksums
        if: matrix.node == 22
        run: npm run fetch-helper -- --target all
